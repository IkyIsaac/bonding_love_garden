<!-- Not visible in Login Flow as per "The UX Goal" in guidelines -->
<script>
        function dismissBanner() {
            const banner = document.getElementById('disclaimer-banner');
            banner.style.transform = 'translateY(-100%)';
            setTimeout(() => banner.remove(), 500);
        }

        function transitionToOtp() {
            const phoneVal = document.getElementById('phone-input').value;
            if (phoneVal.length < 10) {
                document.getElementById('phone-input').classList.add('shake', 'border-error');
                setTimeout(() => document.getElementById('phone-input').classList.remove('shake'), 400);
                return;
            }
            
            document.getElementById('display-phone').innerText = `+1 ${phoneVal}`;
            document.getElementById('screen-phone').classList.add('hidden');
            const otpScreen = document.getElementById('screen-otp');
            otpScreen.classList.remove('hidden');
            otpScreen.classList.add('fade-in');
            
            startResendTimer();
            focusOtpInputs();
        }

        function transitionToPhone() {
            document.getElementById('screen-otp').classList.add('hidden');
            document.getElementById('screen-phone').classList.remove('hidden');
            document.getElementById('screen-phone').classList.add('fade-in');
        }

        function focusOtpInputs() {
            const inputs = document.querySelectorAll('.otp-input');
            inputs[0].focus();
            inputs.forEach((input, index) => {
                input.addEventListener('keyup', (e) => {
                    if (e.key >= 0 && e.key <= 9) {
                        if (index < inputs.length - 1) inputs[index + 1].focus();
                    } else if (e.key === 'Backspace') {
                        if (index > 0) inputs[index - 1].focus();
                    }
                });
            });
        }

        function startResendTimer() {
            let seconds = 59;
            const timerEl = document.getElementById('timer');
            const btn = document.getElementById('resend-btn');
            btn.disabled = true;

            const interval = setInterval(() => {
                seconds--;
                timerEl.innerText = `00:${seconds < 10 ? '0' + seconds : seconds}`;
                if (seconds <= 0) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.innerHTML = 'Resend Code';
                }
            }, 1000);
        }

        function verifyOtp() {
            const inputs = document.querySelectorAll('.otp-input');
            const otp = Array.from(inputs).map(i => i.value).join('');
            
            if (otp.length < 6) {
                document.getElementById('otp-container').classList.add('shake');
                setTimeout(() => document.getElementById('otp-container').classList.remove('shake'), 400);
                return;
            }

            // Simulate success
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                btn.innerHTML = 'Welcome back!';
                btn.classList.replace('bg-secondary-container', 'bg-primary-container');
                window.alert('Verification Successful! Redirecting to Love Garden Dashboard...');
            }, 1500);
        }

        // Phone input formatting
        document.getElementById('phone-input').addEventListener('input', function(e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
