name: docs-site-ci

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/docs-site-ci.yml"]
  pull_request:
    paths: ["docs-site/**", ".github/workflows/docs-site-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
